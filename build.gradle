plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.0'
    id 'io.spring.dependency-management' version '1.1.0'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    group = 'com.yunkesoftware.www'
    version = '1.0'
    // 指定编译版本
    sourceCompatibility = 17
    targetCompatibility = 17
    // 配置字符编码
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    repositories {
        mavenLocal()
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
        maven { url 'https://maven.aliyun.com/repository/grails-core' }
        maven { url 'https://maven.aliyun.com/repository/apache-snapshots' }
        maven { url 'https://mvnrepository.com' }
        repositories {
            maven {
                url 'https://maven.aliyun.com/repository/public'
            }
            maven {
                credentials {
                    username '62beb3c4dbd131f866c5649a'
                    password 'SJblRdz35Mf3'
                }
                url 'https://packages.aliyun.com/62beb3d0a61bf880d4cb2137/maven/2248064-snapshot-mvkcsh'
            }
        }
        mavenCentral()
    }

}

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    javacppPlatform = 'linux-x86_64'
    configuration = [javaVersion = JavaVersion.VERSION_17]
    versions = [mybatisPlusVersion = '3.5.7',
                fastjson2Version = '2.0.43',
                saTokenVersion = '1.39.0',
                knife4jVersion = '4.5.0',
                okhttpVersion = '4.1.0',
                aspectjVersion = '1.9.4',
                hutoolVersion = '5.8.0',
                easyexcelVersion = '3.3.1',
                p6spyVersion = '3.9.1',
                weixinVersion = '4.8.0',
                tencentCosVersion = '5.6.133',
                orikaVersion = '1.5.4',
                velocityVersion = '2.3'
    ]

    lib = [
            "fastJson"         : "com.alibaba.fastjson2:fastjson2:${fastjson2Version}",
            "orika"            : "ma.glasnost.orika:orika-core:${orikaVersion}",
            "mybatisPlus"      : "com.baomidou:mybatis-plus-spring-boot3-starter:${mybatisPlusVersion}",
            "mybatisGenerator" : "com.baomidou:mybatis-plus-generator:${mybatisPlusVersion}",
            "velocity"         : "org.apache.velocity:velocity-engine-core:${velocityVersion}",
            "hutool"           : "cn.hutool:hutool-all:${hutoolVersion}",
            "easyexcel"        : "com.alibaba:easyexcel:${easyexcelVersion}",
            //日志输出工具
            "p6spy"            : "p6spy:p6spy:${p6spyVersion}",

            //微信第三方工具(尽量使用统一版本号)
            "weixinJavaMiniaap": "com.github.binarywang:wx-java-miniapp-spring-boot-starter:${weixinVersion}",
            //腾讯云对象存储
            "tencentCos"       : "com.qcloud:cos_api:${tencentCosVersion}",
            //权限
            "token"            : "cn.dev33:sa-token-spring-boot3-starter:${saTokenVersion}",
            "satokenRedis"     : "cn.dev33:sa-token-redis-fastjson2:${saTokenVersion}",
            "tokenRedis"       : "cn.dev33:sa-token-alone-redis:${saTokenVersion}",

            //文档
            "apiDoc"           : "com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:${knife4jVersion}",
            //请求工具
            "okhttp"           : "com.squareup.okhttp3:okhttp:${okhttpVersion}",
            "aspectj"          : "org.aspectj:aspectjrt:${aspectjVersion}",
            "aspectjweaver"    : "org.aspectj:aspectjweaver:${aspectjVersion}"
    ]
    enableCrashlytics = true
}

subprojects {
    //配置子模块依赖
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-undertow'
        implementation 'io.netty:netty-all'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        implementation 'org.apache.commons:commons-pool2'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        implementation 'com.qcloud:cos-sts_api:3.1.1'
        runtimeOnly 'com.mysql:mysql-connector-j'
        implementation "${lib["fastJson"]}"
        implementation "${lib["velocity"]}"
        implementation "${lib["mybatisPlus"]}"
        implementation "${lib.'tencentCos'}"
        implementation "${lib.'weixinJavaMiniaap'}"
        implementation "${lib.'aspectj'}"
        implementation "${lib.'aspectjweaver'}"
        implementation "${lib.'apiDoc'}"
        implementation "${lib.'token'}", {
            exclude module: 'spring-boot-starter-tomcat'
        }
        implementation "${lib.'tokenRedis'}"
        implementation "${lib.'satokenRedis'}"
        runtimeOnly "${lib.'p6spy'}"
        implementation "${lib.'easyexcel'}"
        implementation "${lib.'hutool'}"
        implementation "${lib.'orika'}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"        //这里最好选择UTF-8
}

