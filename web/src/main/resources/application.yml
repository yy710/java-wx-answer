spring:
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB
  profiles:
    active: prod
logging:
  level:
    root: info
    org.springframework.web: info
    cn.binarywang.wx.miniapp: debug
wx:
  mp:
    configs:
      - appId:   # 小程序微信公众平台appId
        secret:   # 小程序微信公众平台api秘钥
        token:  #微信小程序消息服务器配置的token
        aesKey:  #微信小程序消息服务器配置的EncodingAESKey
        msgDataFormat: XML

cache:
  type: memory

upload:
  uploadType: cos
  serverUrl: 
  accessKey: 
  secretKey: 
  bucket: 
  region: 
  post: ?x-oss-process=video/snapshot,t_1,m_fast
